name: Build report

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivial build step
        run: |
          echo "drill-report placeholder build report" > drill-report.txt
          echo "Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> drill-report.txt
          echo "Repo: ${{ github.repository }} (branch: ${{ github.ref_name }})" >> drill-report.txt
          echo "Build status: SUCCESS" >> drill-report.txt

      - name: Upload drill report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drill-report
          path: drill-report.txt
          retention-days: 5
